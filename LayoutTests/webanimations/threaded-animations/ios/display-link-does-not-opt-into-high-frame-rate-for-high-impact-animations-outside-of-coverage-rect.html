<!DOCTYPE html> <!-- webkit-test-runner [ ThreadedTimeBasedAnimationsEnabled=true ThreadedTimeBasedAnimationsAtHighFrameRateEnabled=true ] -->
<body>
<style>

#target {
    position: absolute;
    left: 0;
    top: 20000px;
    width: 100px;
    height: 100px;
    background-color: black;
}

</style>

<div id="target"></div>

<script src="../../../resources/testharness.js"></script>
<script src="../../../resources/testharnessreport.js"></script>
<script src="../../../resources/ui-helper.js"></script>
<script src="../threaded-animations-utils.js"></script>

<script>

const presentationUpdate = async () => {
    await threadedAnimationsCommit();
    await UIHelper.ensurePresentationUpdate();
};

const assertTranslateAnimationImpact = async (expectedHighImpact, description) => {
    const acceleratedAnimations = internals.acceleratedAnimationsForElement(target);
    assert_equals(acceleratedAnimations.length, 1);
    assert_equals(acceleratedAnimations[0].property, "translate");
    assert_equals(acceleratedAnimations[0].hasHighImpact, expectedHighImpact, description);
    assert_equals(await UIHelper.displayLinkWantsHighFrameRate(), expectedHighImpact, description);
};

promise_test(async t => {
    const duration = 1000 * 1000;

    // The target starts far below the viewport, so its 'translate' animation, which would
    // otherwise be considered high-impact, should not opt into high frame rate updates.
    const animation = target.animate({ translate: "1000px" }, duration);
    await animationAcceleration(animation);
    await presentationUpdate();
    await assertTranslateAnimationImpact(false, "Animating 'translate' far outside of the coverage rect does not yield high frame rate display link updates");

    // Moving the target within the viewport should opt into high frame rate updates.
    target.style.top = "0";
    await presentationUpdate();
    await assertTranslateAnimationImpact(true, "Animating 'translate' within the coverage rect yields high frame rate display link updates");

    // Moving the target back outside of the coverage rect should return to a non-high frame rate.
    target.style.top = "20000px";
    await presentationUpdate();
    await assertTranslateAnimationImpact(false, "Animating 'translate' back outside of the coverage rect no longer yields high frame rate display link updates");

    // Scrolling the target into view in the UI process should opt into high frame rate updates.
    await UIHelper.immediateScrollTo(0, 19900);
    await presentationUpdate();
    await presentationUpdate();
    await assertTranslateAnimationImpact(true, "Scrolling to an element with a 'translate' animation yields high frame rate display link updates");

    // And scrolling away from it should return to a non-high frame rate.
    await UIHelper.immediateScrollTo(0, 0);
    await presentationUpdate();
    await presentationUpdate();
    await assertTranslateAnimationImpact(false, "Scrolling away from an element with a 'translate' animation no longer yields high frame rate display link updates");
}, "Display link only opts into high frame rate updates for high-impact animations within the coverage rect");

</script>
</body>
